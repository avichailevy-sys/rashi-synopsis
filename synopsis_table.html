padding:.42rem .4rem;border-left:1px solid #55504a;text-align:right;vertical-align:middle;direction:ltr}
thead th.ref{background:#4d5a4e}

td{padding:.42rem .45rem;vertical-align:top;line-height:1.8;border-left:1px solid #f0ece4;

td:last-child,th:last-child{border-left:none}

tr.new td.rv,tr.new td.dh{background:var(--newbg)}
tr.seg td.rv,tr.seg td.dh{background:var(--segbg)}

w.a{background:var(--addbg);color:var(--add);border-radius:2px;padding:0 .1em}
w.c{background:var(--chgbg);color:var(--chg);border-radius:2px;padding:0 .1em}

.none{color:#c9c2b5;font-style:italic;font-size:.75rem}
.abs{color:var(--del);font-weight:600;font-size:.76rem}
.note{color:#7a5a86;font-size:.74rem;font-style:italic}
.key span{padding:0 .3rem;border-radius:2px;font-size:.72rem}

<script>
